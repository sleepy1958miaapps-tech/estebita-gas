{% extends "base.html" %}

{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="mb-3 text-center">
                <h3 class="text-primary m-0 fw-bold">Lista de Precios</h3>
            </div>

            <div class="card shadow-sm border-0 mb-3 bg-light">
                <div class="card-body p-3 text-center">
                    <form action="/precios" method="POST">
                        <label for="tasaDolar" class="form-label fw-bold mb-1">Tasa del Dólar (BCV):</label>
                        <div class="input-group input-group-lg mx-auto mb-2" style="max-width: 280px;">
                            <span class="input-group-text bg-primary text-white fw-bold">Bs.</span>
                            <!-- Cambiamos el nombre de la función en el oninput -->
                            <input type="text" id="tasaDolar" name="tasa_cambio" class="form-control fw-bold text-center" value="{{ tasa_cambio }}" oninput="calculadoraSegura()" required>
                        </div>
                        <button type="submit" class="btn btn-success btn-sm px-4 fw-bold">Guardar Tasa</button>
                    </form>
                </div>
            </div>

            <div class="table-responsive">
                <!-- Cambiamos el ID de la tabla -->
                <table class="table table-hover align-middle mb-0 text-center" id="tabla-secreta">
                    <thead class="table-dark">
                        <tr>
                            <th>Producto</th>
                            <th>Precio Base</th>
                            <th>Total a Pagar</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for bombona, precio_usd in precios_usd.items() %}
                        <tr>
                            <td class="fw-bold">{{ bombona }}</td>
                            <td>${{ "%.2f"|format(precio_usd) }}</td>
                            <!-- Nueva clase "valor-bolivares" que ningún otro script conoce -->
                            <td class="fw-bold text-success fs-5 valor-bolivares" data-monto="{{ precio_usd }}">
                                Bs. {{ "%.2f"|format(precio_usd * tasa_cambio) }}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <div class="d-grid gap-2 mt-3">
                <a href="/" class="btn btn-secondary">Volver al Menú</a>
            </div>

        </div>
    </div>
</div>

<script>
// Le cambiamos el nombre a la función para que no choque con nada
function calculadoraSegura() {
    let tasaInput = document.getElementById('tasaDolar').value;
    tasaInput = tasaInput.replace(',', '.');
    let tasa = parseFloat(tasaInput) || 0;

    // Buscamos la nueva clase secreta
    let celdas = document.querySelectorAll('.valor-bolivares');

    celdas.forEach(function(celda) {
        let precio = parseFloat(celda.getAttribute('data-monto')) || 0;
        let total = precio * tasa;
        celda.innerText = 'Bs. ' + total.toFixed(2);
    });
}
</script>
{% endblock %}
